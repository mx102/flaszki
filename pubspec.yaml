name: flaszki
description: "Flaszki: a fluid-sorting puzzle game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

workspace:
  - packages/flaszki_logic

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flaszki_logic:
    path: packages/flaszki_logic
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  flutter_soloud: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - CREDITS.md
    - assets/audio/
